name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  smoke:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t page-pulse:ci .

      - name: Run container
        run: docker run -d --name pp -p 8000:8000 -e LOG_LEVEL=INFO page-pulse:ci

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "service is up"; exit 0
            fi
            sleep 2
          done
          echo "service failed to start"; docker logs pp; exit 1

      - name: Assert health payload
        run: curl -fsS http://localhost:8000/api/health | grep -q '"status":"ok"'

      - name: Assert validation contract
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/audit \
            -H 'Content-Type: application/json' -d '{"url":"not-a-url"}')
          test "$code" = "422"

      - name: Container logs
        if: always()
        run: docker logs pp
